services:
  # Web service for FastAPI backend
  - type: web
    name: sport-color-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 10000
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sport-color-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

databases:
  # Managed PostgreSQL database (Render Free Tier)
  - name: sport-color-db
    plan: free
    databaseName: sport_color_db
    user: sport_color_admin
